
name: DevOps Java CI Automation Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17, 21]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: Compile code base
        run: mvn clean compile

      - name: Run automated test suites
        run: mvn test

      - name: Package executable distribution
        run: mvn package

      - name: Upload build artifact for verification
        uses: actions/upload-artifact@v4
        with:
          name: production-ready-jar-java-${{ matrix.java-version }}
          path: target/*.jar
          retention-days: 5
  deploy-staging:
    needs: build-and-validate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Deploy to staging container
        run: |
          echo "Approval granted! Deploying to staging stack..."
          docker compose up -d
